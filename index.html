<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rai News 24 Live - Virgin Active</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

/* PAGINA ORARIO */

#clockPage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    z-index: 10;
    background: #000;
}

/* PAGINA RAI */

#raiPage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    z-index: 1;
    background: #000;
}

</style>
</head>

<body>

<!--
========================================================
PAGINA ORARIO VIRGIN ACTIVE
Rimane visibile durante il caricamento
========================================================
-->

<iframe
    id="clockPage"
    src="https://piovanim-art.github.io/oraribrescia/"
    frameborder="0"
    scrolling="no">
</iframe>


<!--
========================================================
RAI NEWS 24
========================================================
-->

<iframe
    id="raiPage"
    src="https://www.raiplay.it/dirette/rainews24"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen
    frameborder="0"
    scrolling="no">
</iframe>


<script>

/*
========================================================
VIRGIN ACTIVE - RAI NEWS 24
========================================================

1. Carica subito la pagina Rai in background.
2. Mantiene l'orario Virgin Active davanti.
3. Dopo 15 secondi nasconde l'orario.
4. Rimane Rai News 24 a tutto schermo.
========================================================
*/


/*
--------------------------------------------------------
TEMPO DI CARICAMENTO
--------------------------------------------------------

15 secondi
--------------------------------------------------------
*/

setTimeout(function () {

    document.getElementById("clockPage").style.display = "none";

}, 15000);


/*
--------------------------------------------------------
RICARICA AUTOMATICA
--------------------------------------------------------

Ogni 6 ore per mantenere fresca la sessione.
--------------------------------------------------------
*/

setTimeout(function () {

    location.reload();

}, 6 * 60 * 60 * 1000);


/*
--------------------------------------------------------
GESTIONE ERRORI
--------------------------------------------------------

Se la pagina principale genera un errore,
prova a ricaricare.
--------------------------------------------------------
*/

window.addEventListener("error", function () {

    setTimeout(function () {

        location.reload();

    }, 10000);

});

</script>

</body>
</html>
