<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rai News 24 Live - Virgin Active</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

/* =====================================================
   PAGINA ORARIO VIRGIN ACTIVE
   ===================================================== */

#clockPage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    margin: 0;
    padding: 0;
    background: #000;
    z-index: 20;
}


/* =====================================================
   RAI NEWS 24
   ===================================================== */

#raiPage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    margin: 0;
    padding: 0;
    background: #000;
    z-index: 10;
}

</style>
</head>


<body>


<!-- ===================================================
     ORARIO VIRGIN ACTIVE
     
     Rimane davanti durante il caricamento
     di Rai News 24.
     =================================================== -->

<iframe
    id="clockPage"
    src="https://piovanim-art.github.io/oraribrescia/"
    frameborder="0"
    scrolling="no">
</iframe>


<!-- ===================================================
     RAI NEWS 24 LIVE
     
     La pagina viene caricata immediatamente
     sotto l'orario.
     =================================================== -->

<iframe
    id="raiPage"
    src="https://www.rainews.it/dirette/diretta-rainews24"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen
    frameborder="0"
    scrolling="no">
</iframe>


<script>

/*
========================================================
VIRGIN ACTIVE
RAI NEWS 24 LIVE
========================================================

FUNZIONAMENTO:

1. Parte subito l'orario Virgin Active.
2. Rai News 24 viene caricata contemporaneamente
   in background.
3. L'orario rimane visibile per 15 secondi.
4. Dopo 15 secondi l'orario viene nascosto.
5. Rimane visibile Rai News 24.
========================================================
*/


/* =====================================================
   TIMER ORARIO
   =====================================================

   15 secondi
   ===================================================== */

setTimeout(function () {

    const clock = document.getElementById("clockPage");

    if (clock) {
        clock.style.display = "none";
    }

}, 15000);


/* =====================================================
   REFRESH AUTOMATICO
   =====================================================

   Ogni 6 ore.
   Serve per mantenere fresca la sessione.
   ===================================================== */

setTimeout(function () {

    location.reload();

}, 6 * 60 * 60 * 1000);


/* =====================================================
   GESTIONE ERRORI
   =====================================================

   Se la pagina principale genera un errore,
   prova a ricaricare dopo 10 secondi.
   ===================================================== */

window.addEventListener("error", function () {

    setTimeout(function () {

        location.reload();

    }, 10000);

});

</script>


</body>
</html>
