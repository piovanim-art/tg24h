<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sky TG24 Live - Virgin Active</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

/* PAGINA ORARIO */

#clockPage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    z-index: 20;
    background: #000;
}

/* SKY TG24 */

#skyPage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    z-index: 10;
    background: #000;

    opacity: 0;

    transition: opacity 0.8s ease;
}

#skyPage.visible {
    opacity: 1;
}

</style>
</head>

<body>

<!--
========================================================
VIRGIN ACTIVE CLOCK
Rimane visibile durante il caricamento di Sky TG24
========================================================
-->

<iframe
    id="clockPage"
    src="https://piovanim-art.github.io/oraribrescia/"
    scrolling="no">
</iframe>


<!--
========================================================
SKY TG24 LIVE
========================================================
-->

<iframe
    id="skyPage"
    src="https://video.sky.it/diretta/tg24-live"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen
    frameborder="0"
    scrolling="no">
</iframe>


<script>

/*
========================================================
VIRGIN ACTIVE
ORARIO → SKY TG24 LIVE
========================================================
*/


/*
--------------------------------------------------------
DOPO 15 SECONDI
mostra Sky TG24
--------------------------------------------------------
*/

setTimeout(function () {

    const clock = document.getElementById("clockPage");
    const sky = document.getElementById("skyPage");

    /*
    Prima facciamo comparire Sky
    */

    sky.classList.add("visible");


    /*
    Poi togliamo completamente l'orologio
    */

    setTimeout(function () {

        clock.style.display = "none";

    }, 800);

}, 15000);


/*
--------------------------------------------------------
RICARICA AUTOMATICA OGNI 6 ORE
--------------------------------------------------------
*/

setTimeout(function () {

    location.reload();

}, 6 * 60 * 60 * 1000);


/*
--------------------------------------------------------
SE LA PAGINA GENERA UN ERRORE
ricarica dopo 10 secondi
--------------------------------------------------------
*/

window.addEventListener("error", function () {

    setTimeout(function () {

        location.reload();

    }, 10000);

});

</script>

</body>
</html>
