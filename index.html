<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rai News 24 Live - Virgin Active</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

/* =========================================
   PAGINA ORARIO
   ========================================= */

#clockPage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    z-index: 10;
    background: #000;
}


/* =========================================
   VIDEO RAI NEWS 24
   ========================================= */

#video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    z-index: 1;
}

</style>
</head>

<body>

<!-- =========================================
     ORARIO VIRGIN ACTIVE
     ========================================= -->

<iframe
    id="clockPage"
    src="https://piovanim-art.github.io/oraribrescia/"
    frameborder="0"
    scrolling="no">
</iframe>


<!-- =========================================
     VIDEO RAI NEWS 24
     ========================================= -->

<video
    id="video"
    autoplay
    muted
    playsinline
    controls="false">
</video>


<!-- =========================================
     HLS.JS
     ========================================= -->

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>


<script>

/*
========================================================
VIRGIN ACTIVE - RAI NEWS 24
========================================================

ORARIO
   ↓
15 SECONDI DI CARICAMENTO
   ↓
RAI NEWS 24 LIVE

Il video viene caricato immediatamente
in background mentre rimane visibile l'orario.
========================================================
*/


/*
--------------------------------------------------------
STREAM RAI NEWS 24
--------------------------------------------------------
*/

const STREAM_URL =
    "https://rainews1-live.akamaized.net/hls/live/598326/rainews1/rainews1/playlist.m3u8";


const video = document.getElementById("video");


/*
--------------------------------------------------------
AVVIO HLS
--------------------------------------------------------
*/

function startStream() {

    if (Hls.isSupported()) {

        const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            autoStartLoad: true
        });

        hls.loadSource(STREAM_URL);

        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {

            video.play().catch(function () {

                console.log("Autoplay bloccato dal browser.");

            });

        });


        /*
        -----------------------------------------------
        ERRORI HLS
        -----------------------------------------------
        */

        hls.on(Hls.Events.ERROR, function (event, data) {

            console.log("Errore HLS:", data);

            if (data.fatal) {

                setTimeout(function () {

                    location.reload();

                }, 10000);

            }

        });

    }

    /*
    -----------------------------------------------
    Safari / browser con HLS nativo
    -----------------------------------------------
    */

    else if (video.canPlayType("application/vnd.apple.mpegurl")) {

        video.src = STREAM_URL;

        video.addEventListener("loadedmetadata", function () {

            video.play().catch(function () {

                console.log("Autoplay bloccato.");

            });

        });

    }

}


/*
--------------------------------------------------------
AVVIA SUBITO LO STREAM
--------------------------------------------------------
*/

startStream();


/*
--------------------------------------------------------
ORARIO VIRGIN ACTIVE
--------------------------------------------------------

Rimane davanti per 15 secondi.
Durante questi 15 secondi Rai News
si carica dietro.
--------------------------------------------------------
*/

setTimeout(function () {

    document.getElementById("clockPage").style.display = "none";

}, 15000);


/*
--------------------------------------------------------
REFRESH AUTOMATICO
--------------------------------------------------------

Ogni 6 ore.
--------------------------------------------------------
*/

setTimeout(function () {

    location.reload();

}, 6 * 60 * 60 * 1000);


/*
--------------------------------------------------------
SE LA PAGINA GENERA UN ERRORE
--------------------------------------------------------
*/

window.addEventListener("error", function () {

    setTimeout(function () {

        location.reload();

    }, 10000);

});

</script>

</body>
</html>
